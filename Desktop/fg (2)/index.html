<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bnb-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI BNB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              scroll: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(-50%)' },
              },
              'fade-in-down': {
                '0%': {
                  opacity: '0',
                  transform: 'translateY(-20px)'
                },
                '100%': {
                  opacity: '1',
                  transform: 'translateY(0)'
                },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'pulse-bg': {
                '0%, 100%': { backgroundColor: 'transparent' },
                '50%': { backgroundColor: 'rgba(7, 193, 96, 0.15)' },
              },
              'pulse-bg-once': {
                '0%, 100%': { backgroundColor: 'transparent' },
                '50%': { backgroundColor: 'rgba(7, 193, 96, 0.15)' },
              },
              'pop': {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '50%': { transform: 'scale(1.2)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              'shake': {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-3px)' },
                '75%': { transform: 'translateX(3px)' },
              },
            },
            animation: {
              'scroll-vertical': 'scroll 40s linear infinite',
              'fade-in-down': 'fade-in-down 0.5s ease-out forwards',
              'fade-in': 'fade-in 0.3s ease-out forwards',
              'pulse-bg': 'pulse-bg 2s ease-in-out infinite',
              'pulse-bg-once': 'pulse-bg-once 2s ease-in-out',
              'pop': 'pop 0.3s ease-out forwards',
              'shake': 'shake 0.2s ease-in-out forwards',
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-[#efefef]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
